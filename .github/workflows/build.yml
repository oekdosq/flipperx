name: Build FlipperX Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.10.2'
  ANDROID_SDK_VERSION: '36'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'

jobs:
  build:
    name: Build & Verify Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-${{ env.ANDROID_SDK_VERSION }} build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flipperx-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK (Unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Unsigned Release APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$APK_PATH" ]; then
            echo "Unsigned Release APK found at: $APK_PATH"
            ls -lh "$APK_PATH"
            sha256sum "$APK_PATH"
          else
            echo "Unsigned Release APK not found at expected path"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

      - name: Sign Release APK
        if: env.SIGNING_KEY != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != ''
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Verify Signed APK
        if: steps.sign_apk.outputs.signedReleaseFile != ''
        run: |
          SIGNED_APK="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          echo "Signed APK: $SIGNED_APK"
          ls -lh "$SIGNED_APK"
          
          # Verify signature
          apksigner verify --verbose "$SIGNED_APK"
          
          # Generate SHA-256
          sha256sum "$SIGNED_APK" > signed_apk_sha256.txt
          cat signed_apk_sha256.txt
          
          # Verify package info
          aapt2 dump badging "$SIGNED_APK" | head -20

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: flipperx-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload Signed Release APK
        if: steps.sign_apk.outputs.signedReleaseFile != ''
        uses: actions/upload-artifact@v4
        with:
          name: flipperx-release-signed
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          retention-days: 30

      - name: Upload SHA-256
        if: steps.sign_apk.outputs.signedReleaseFile != ''
        uses: actions/upload-artifact@v4
        with:
          name: flipperx-sha256
          path: signed_apk_sha256.txt
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: com.flipperx.mobile" >> $GITHUB_STEP_SUMMARY
          echo "- **Target SDK**: 36 (Android 16)" >> $GITHUB_STEP_SUMMARY
          echo "- **Min SDK**: 26" >> $GITHUB_STEP_SUMMARY
          if [ -f "signed_apk_sha256.txt" ]; then
            echo "- **SHA-256**: $(cat signed_apk_sha256.txt)" >> $GITHUB_STEP_SUMMARY
          fi